<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030711">
<title>РАДО — Орбитальный подбор шин</title>
<style>
:root {
  --bg: #030711;
  --ink: #f6fbff;
  --muted: #9bb0c9;
  --blue: #47b8ff;
  --cyan: #8ee5ff;
  --red: #ff544c;
  --line: rgba(151, 205, 255, .24);
  --glass: rgba(7, 16, 31, .64);
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; min-height: 100%; }
body {
  color: var(--ink);
  background: var(--bg);
  font-family: Arial, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow: hidden;
}
button, input { font: inherit; }
button { cursor: pointer; }
.app {
  height: 100dvh;
  min-height: 700px;
  position: relative;
  overflow: hidden;
  background:
    linear-gradient(180deg, rgba(3, 7, 17, .22), rgba(3, 7, 17, .84)),
    url("public/rado-ai-hero.png") center/cover no-repeat;
}
.app::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% 48%, rgba(17, 114, 189, .28), transparent 34%),
    linear-gradient(90deg, rgba(3, 7, 17, .75), transparent 30%, transparent 70%, rgba(3, 7, 17, .72)),
    repeating-linear-gradient(90deg, rgba(105, 185, 255, .04) 0 1px, transparent 1px 96px);
  pointer-events: none;
  animation: ambient 18s linear infinite;
}
@keyframes ambient { to { background-position: center, center, 96px 0; } }
.topbar {
  position: absolute;
  z-index: 80;
  top: 0;
  left: 0;
  right: 0;
  height: 76px;
  display: flex;
  align-items: center;
  gap: 22px;
  padding: 0 32px;
  border-bottom: 1px solid var(--line);
  background: rgba(3, 7, 17, .54);
  backdrop-filter: blur(24px);
}
.brand { font-size: 28px; font-weight: 950; }
.brand small {
  display: block;
  margin-top: -2px;
  color: var(--cyan);
  font-size: 9px;
  letter-spacing: .2em;
  text-transform: uppercase;
}
.search {
  width: min(520px, 42vw);
  margin-left: auto;
  position: relative;
}
.search input {
  width: 100%;
  height: 46px;
  border: 1px solid var(--line);
  border-radius: 14px;
  outline: 0;
  color: #fff;
  background: rgba(255, 255, 255, .075);
  padding: 0 48px 0 16px;
}
.search input:focus { border-color: rgba(91, 201, 255, .72); box-shadow: 0 0 0 4px rgba(71, 184, 255, .10); }
.search button {
  position: absolute;
  right: 6px;
  top: 6px;
  width: 34px;
  height: 34px;
  border: 0;
  border-radius: 10px;
  color: #06101d;
  background: var(--cyan);
  font-weight: 950;
}
.stock {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #d6eaff;
  font-size: 12px;
  font-weight: 900;
  white-space: nowrap;
}
.stock::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #54f0b0;
  box-shadow: 0 0 16px #54f0b0;
}
.stepper {
  position: absolute;
  z-index: 70;
  top: 96px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 5px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: rgba(5, 14, 28, .58);
  backdrop-filter: blur(22px);
}
.step {
  min-width: 118px;
  height: 40px;
  border: 0;
  border-radius: 11px;
  color: var(--muted);
  background: transparent;
  font-size: 13px;
  font-weight: 900;
}
.step span { opacity: .56; margin-right: 5px; }
.step.active { color: #06101d; background: linear-gradient(135deg, #e9f8ff, #73d2ff); }
.step.done { color: #d8edff; background: rgba(71, 184, 255, .10); }
.orbital-field {
  position: absolute;
  inset: 76px 0 0;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  outline: none;
  perspective: 1300px;
}
.space-grid {
  position: absolute;
  left: 50%;
  top: 53%;
  width: min(92vw, 1320px);
  height: min(50vw, 650px);
  transform: translate(-50%, -50%) rotateX(64deg);
  border-radius: 50%;
  border: 1px solid rgba(111, 192, 255, .16);
  box-shadow:
    0 0 0 70px rgba(84, 172, 255, .025),
    0 0 0 140px rgba(84, 172, 255, .018),
    inset 0 0 80px rgba(71, 184, 255, .08);
  pointer-events: none;
}
.space-grid::before,
.space-grid::after {
  content: "";
  position: absolute;
  inset: 12%;
  border: 1px solid rgba(128, 201, 255, .18);
  border-radius: 50%;
}
.space-grid::after { inset: 28%; border-color: rgba(255, 92, 81, .14); }
.orbit-glow {
  position: absolute;
  left: 50%;
  top: 52%;
  width: min(55vw, 760px);
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(57, 174, 255, .19), rgba(57, 174, 255, .05) 35%, transparent 68%);
  filter: blur(9px);
  pointer-events: none;
}
.centerpiece {
  position: absolute;
  z-index: 30;
  left: 50%;
  top: 52%;
  width: clamp(260px, 31vw, 480px);
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  display: grid;
  place-items: center;
  pointer-events: none;
}
.centerpiece::before {
  content: "";
  position: absolute;
  inset: 18%;
  border-radius: 50%;
  border: 1px solid rgba(113, 211, 255, .40);
  box-shadow: 0 0 80px rgba(44, 169, 255, .45), inset 0 0 70px rgba(44, 169, 255, .14);
  animation: corePulse 3.2s ease-in-out infinite;
}
@keyframes corePulse { 50% { transform: scale(1.05); filter: brightness(1.35); } }
.centerpiece img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 35px 38px rgba(0, 0, 0, .58)) drop-shadow(0 0 20px rgba(98, 205, 255, .18));
  animation: tireFloat 5.5s ease-in-out infinite;
}
@keyframes tireFloat {
  0%, 100% { transform: translateY(3px) rotate(-1deg); }
  50% { transform: translateY(-10px) rotate(1.5deg); }
}
.orbit-layer {
  position: absolute;
  inset: 0;
  z-index: 35;
  pointer-events: none;
}
.orbit-option {
  position: absolute;
  left: 0;
  top: 0;
  width: 168px;
  min-height: 66px;
  border: 1px solid var(--line);
  border-radius: 16px;
  color: #f1f8ff;
  background: rgba(5, 15, 31, .70);
  box-shadow: 0 18px 60px rgba(0, 0, 0, .36);
  backdrop-filter: blur(20px);
  padding: 11px 13px;
  text-align: left;
  pointer-events: auto;
  transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
  will-change: transform, opacity;
}
.orbit-option b {
  display: block;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 15px;
}
.orbit-option small {
  display: block;
  margin-top: 5px;
  color: var(--muted);
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 11px;
  font-weight: 850;
}
.orbit-option:hover,
.orbit-option:focus-visible {
  border-color: rgba(108, 214, 255, .82);
  background: rgba(24, 91, 143, .78);
  box-shadow: 0 20px 70px rgba(23, 148, 232, .25);
  outline: 0;
}
.orbit-option.active {
  color: #07111e;
  border-color: transparent;
  background: linear-gradient(135deg, #f2fbff, #79d7ff);
}
.orbit-option.active small { color: #234c68; }
.orbit-option.result.active {
  color: #fff;
  background: linear-gradient(135deg, #ff5149, #ff8243);
  box-shadow: 0 20px 70px rgba(255, 81, 73, .30);
}
.orbit-option.result.active small { color: rgba(255,255,255,.78); }
.ai-status {
  position: absolute;
  z-index: 55;
  left: 30px;
  top: 116px;
  width: min(300px, calc(100vw - 60px));
  color: #dceeff;
}
.ai-status .eyebrow {
  color: var(--cyan);
  font-size: 10px;
  font-weight: 950;
  letter-spacing: .16em;
  text-transform: uppercase;
}
.ai-status h1 {
  margin: 7px 0 5px;
  font-size: 24px;
  line-height: 1.05;
  letter-spacing: 0;
}
.ai-status p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
.guide {
  position: absolute;
  z-index: 50;
  right: 30px;
  top: 116px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 850;
}
.guide i {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  color: var(--cyan);
  font-style: normal;
}
.result-dock {
  position: absolute;
  z-index: 65;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%);
  width: min(980px, calc(100vw - 40px));
  min-height: 94px;
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) .75fr .75fr auto;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: rgba(4, 12, 25, .74);
  box-shadow: 0 28px 90px rgba(0, 0, 0, .42);
  backdrop-filter: blur(24px);
}
.dock-block { min-width: 0; padding: 3px 9px; }
.dock-block + .dock-block { border-left: 1px solid rgba(151, 205, 255, .15); }
.dock-title {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 17px;
  font-weight: 950;
}
.dock-meta { margin-top: 5px; color: var(--muted); font-size: 11px; font-weight: 800; }
.dock-value { color: #ff766f; font-size: 25px; font-weight: 950; }
.dock-label { margin-top: 3px; color: var(--muted); font-size: 10px; font-weight: 850; text-transform: uppercase; }
.dock-actions { display: flex; gap: 8px; }
.action {
  min-height: 48px;
  border: 1px solid var(--line);
  border-radius: 14px;
  color: #fff;
  background: rgba(255,255,255,.08);
  padding: 0 15px;
  font-weight: 950;
  white-space: nowrap;
}
.action.primary {
  color: #fff;
  border-color: transparent;
  background: linear-gradient(135deg, #ff5149, #ff8243);
  box-shadow: 0 15px 38px rgba(255, 81, 73, .22);
}
.toast {
  position: fixed;
  z-index: 100;
  left: 50%;
  bottom: 130px;
  transform: translate(-50%, 12px);
  padding: 11px 15px;
  border: 1px solid var(--line);
  border-radius: 13px;
  color: #fff;
  background: rgba(4, 12, 25, .92);
  opacity: 0;
  pointer-events: none;
  transition: .2s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 900px) {
  .topbar { padding: 0 16px; }
  .stock { display: none; }
  .search { width: min(58vw, 440px); }
  .step { min-width: 92px; }
  .ai-status { top: 166px; left: 18px; }
  .guide { top: 166px; right: 18px; }
  .orbit-option { width: 142px; min-height: 60px; }
  .result-dock { grid-template-columns: 1.3fr .7fr auto; }
  .result-dock .set-block { display: none; }
}
@media (max-width: 620px) {
  .app { min-height: 660px; }
  .topbar { height: 66px; gap: 10px; }
  .brand { font-size: 22px; }
  .search { width: auto; flex: 1; }
  .search input { height: 40px; font-size: 13px; padding-left: 12px; }
  .search button { top: 5px; right: 5px; width: 30px; height: 30px; }
  .stepper { top: 77px; width: calc(100vw - 20px); overflow-x: auto; justify-content: flex-start; }
  .step { min-width: 86px; height: 36px; font-size: 11px; }
  .orbital-field { inset: 66px 0 0; }
  .ai-status { top: 132px; left: 14px; width: 230px; }
  .ai-status h1 { font-size: 18px; }
  .ai-status p { font-size: 11px; }
  .guide { top: 140px; right: 12px; }
  .guide span { display: none; }
  .centerpiece { top: 52%; width: clamp(220px, 66vw, 310px); }
  .space-grid { top: 53%; width: 130vw; height: 66vw; }
  .orbit-glow { top: 52%; width: 95vw; }
  .orbit-option { width: 116px; min-height: 54px; padding: 9px; border-radius: 14px; }
  .orbit-option b { font-size: 12px; }
  .orbit-option small { font-size: 9px; }
  .result-dock {
    bottom: 10px;
    width: calc(100vw - 18px);
    min-height: 84px;
    grid-template-columns: minmax(0, 1fr) auto;
    border-radius: 18px;
    padding: 9px;
  }
  .result-dock .price-block, .result-dock .set-block { display: none; }
  .dock-title { font-size: 14px; }
  .dock-meta { font-size: 10px; }
  .dock-actions .action:not(.primary) { display: none; }
  .action { min-height: 44px; padding: 0 12px; font-size: 12px; }
  .toast { bottom: 108px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
}
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand">РАДО<small>orbital tire system</small></div>
    <label class="search">
      <input id="aiSearch" placeholder="Напишите авто, размер или название" autocomplete="off">
      <button id="searchBtn" aria-label="Найти">→</button>
    </label>
    <div class="stock">склад подключен · 825 позиций</div>
  </header>

  <nav class="stepper" aria-label="Этапы подбора">
    <button class="step active" data-mode="size"><span>01</span>Размер</button>
    <button class="step" data-mode="season"><span>02</span>Сезон</button>
    <button class="step" data-mode="budget"><span>03</span>Цена</button>
    <button class="step" data-mode="result"><span>04</span>Шины</button>
  </nav>

  <section class="orbital-field" id="orbitalField" tabindex="0" aria-label="Орбитальный подбор шин">
    <div class="space-grid"></div>
    <div class="orbit-glow"></div>
    <div class="ai-status">
      <div class="eyebrow">AI-подбор в реальном времени</div>
      <h1 id="modeTitle">Выберите размер</h1>
      <p id="aiText">Потяните орбиту и нажмите на подходящий размер.</p>
    </div>
    <div class="guide"><i>↔</i><span>тяните или прокручивайте орбиту</span></div>
    <div class="orbit-layer" id="orbitLayer"></div>
    <div class="centerpiece">
      <img src="public/rado-tire-cutout.png" alt="Автомобильная шина">
    </div>
  </section>

  <aside class="result-dock" aria-live="polite">
    <div class="dock-block">
      <div class="dock-title" id="productTitle">Подбираем лучший комплект</div>
      <div class="dock-meta" id="productMeta">выберите параметры на орбите</div>
    </div>
    <div class="dock-block price-block">
      <div class="dock-value" id="productPrice">—</div>
      <div class="dock-label">за шину</div>
    </div>
    <div class="dock-block set-block">
      <div class="dock-value" id="productSet">—</div>
      <div class="dock-label">комплект 4 шт.</div>
    </div>
    <div class="dock-actions">
      <button class="action" id="shareBtn">Поделиться</button>
      <button class="action primary" id="orderBtn">Забронировать</button>
    </div>
  </aside>
  <div class="toast" id="toast">Заявка скопирована</div>
</main>

const modes = ["size", "season", "budget", "result"];
const modeCopy = {
  size: ["Выберите размер", "Потяните орбиту и нажмите на подходящий размер."],
  season: ["Какой сезон?", "После выбора кольцо перестроится под бюджет."],
  budget: ["Выберите цену", "Покажу только доступные комплекты в вашем диапазоне."],
  result: ["Подходящие шины", "Вращайте варианты вокруг шины и выбирайте комплект."]
};
let state = {
  mode: "size",
  size: "195/65 R15",
  season: "",
  budget: "",
  search: "",
  selectedArticle: ""
};
let rotation = -0.45;
let targetRotation = null;
let dragging = false;
let dragStartX = 0;
let dragStartRotation = 0;
let lastFrame = performance.now();
let optionElements = [];

const $ = (id) => document.getElementById(id);
const norm = (value) => String(value || "").toLowerCase().replace(/r/i, " r").replace(/\s+/g, " ").trim();
const esc = (value) => String(value || "").replace(/[&<>"']/g, (char) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[char]));

function uniqueSizes() {
  const priority = ["195/65 R15", "205/55 R16", "185/65 R15", "215/65 R16", "205/60 R16", "225/45 R17"];
  const all = [...new Set(ITEMS.map((item) => item.size))];
  return [...priority.filter((size) => all.includes(size)), ...all.filter((size) => !priority.includes(size))].slice(0, 14);
}

function filteredItems() {
  return ITEMS.filter((item) => {
    const haystack = norm([item.title, item.brand, item.model, item.size].join(" "));
    return (!state.size || item.size === state.size)
      && (!state.season || item.season === state.season)
      && (!state.budget || item.price <= Number(state.budget))
      && (!state.search || haystack.includes(norm(state.search)));
  }).sort((a, b) => a.price - b.price);
}

function currentItem() {
  const rows = filteredItems();
  return rows.find((item) => item.article === state.selectedArticle) || rows[0] || ITEMS[0];
}

function optionsForMode() {
  if (state.mode === "size") {
    return uniqueSizes().map((size) => ({
      value: size,
      label: size,
      sub: `${ITEMS.filter((item) => item.size === size).length} вариантов`,
      active: size === state.size
    }));
  }
  if (state.mode === "season") {
    return [
      { value: "", label: "Любой сезон", sub: "показать всё", active: state.season === "" },
      { value: "летняя", label: "Летние", sub: "для теплого сезона", active: state.season === "летняя" },
      { value: "зимняя", label: "Зимние", sub: "для холода и снега", active: state.season === "зимняя" }
    ];
  }
  if (state.mode === "budget") {
    return [
      { value: "4000", label: "до 4 000 ₽", sub: "за одну шину", active: state.budget === "4000" },
      { value: "5000", label: "до 5 000 ₽", sub: "за одну шину", active: state.budget === "5000" },
      { value: "7000", label: "до 7 000 ₽", sub: "за одну шину", active: state.budget === "7000" },
      { value: "10000", label: "до 10 000 ₽", sub: "за одну шину", active: state.budget === "10000" },
      { value: "", label: "Без лимита", sub: "показать всё", active: state.budget === "" }
    ];
  }
  return filteredItems().slice(0, 12).map((item) => ({
    value: item.article,
    label: item.brand,
    sub: `${item.model} · ${item.priceText}`,
    active: item.article === currentItem().article,
    item
  }));
}

function setMode(mode) {
  state.mode = mode;
  rotation = -0.45;
  targetRotation = null;
  render();
}

function chooseOption(option, index) {
  if (state.mode === "size") {
    state.size = option.value;
    state.selectedArticle = "";
  } else if (state.mode === "season") {
    state.season = option.value;
    state.selectedArticle = "";
  } else if (state.mode === "budget") {
    state.budget = option.value;
    state.selectedArticle = "";
  } else {
    state.selectedArticle = option.value;
  }
  const total = Math.max(1, optionElements.length);
  targetRotation = Math.PI / 2 - (index / total) * Math.PI * 2;
  updateDock();
  if (state.mode !== "result") {
    window.setTimeout(() => setMode(modes[modes.indexOf(state.mode) + 1]), 260);
  } else {
    renderOrbit();
  }
}

function renderSteps() {
  const currentIndex = modes.indexOf(state.mode);
  document.querySelectorAll(".step").forEach((button, index) => {
    button.classList.toggle("active", button.dataset.mode === state.mode);
    button.classList.toggle("done", index < currentIndex);
  });
}

function renderOrbit() {
  const layer = $("orbitLayer");
  layer.innerHTML = "";
  optionElements = optionsForMode().map((option, index) => {
    const button = document.createElement("button");
    button.className = `orbit-option ${state.mode === "result" ? "result" : ""} ${option.active ? "active" : ""}`;
    button.innerHTML = `<b>${esc(option.label)}</b><small>${esc(option.sub)}</small>`;
    button.addEventListener("click", (event) => {
      event.stopPropagation();
      chooseOption(option, index);
    });
    layer.appendChild(button);
    return { element: button, option, index };
  });
  positionOrbit();
}

function positionOrbit() {
  const field = $("orbitalField");
  const width = field.clientWidth;
  const height = field.clientHeight;
  const centerX = width / 2;
  const centerY = height * .52;
  const rx = Math.min(width * (window.innerWidth <= 620 ? .50 : .42), 620);
  const ry = Math.min(height * (window.innerWidth <= 620 ? .27 : .30), 255);
  const total = Math.max(1, optionElements.length);

  optionElements.forEach(({ element, index }) => {
    const angle = rotation + (index / total) * Math.PI * 2;
    const sin = Math.sin(angle);
    const depth = (sin + 1) / 2;
    const x = centerX + Math.cos(angle) * rx;
    const y = centerY + sin * ry;
    const scale = .68 + depth * .42;
    element.style.transform = `translate3d(${x}px, ${y}px, 0) translate(-50%, -50%) scale(${scale})`;
    element.style.opacity = String(.34 + depth * .66);
    element.style.zIndex = String(10 + Math.round(depth * 40));
    element.style.filter = `blur(${(1 - depth) * .55}px)`;
  });
}

function updateDock() {
  const item = currentItem();
  const rows = filteredItems();
  if (!item) return;
  state.selectedArticle = item.article;
  $("productTitle").textContent = item.title;
  $("productMeta").textContent = `${item.season || "сезон не указан"} · остаток ${item.rest} · найдено ${rows.length}`;
  $("productPrice").textContent = item.priceText;
  $("productSet").textContent = item.setText;
  $("aiText").textContent = state.mode === "result"
    ? `Нашел ${rows.length} вариантов. Впереди самый выгодный, остальные вращаются вокруг шины.`
    : modeCopy[state.mode][1];
}

function render() {
  $("modeTitle").textContent = modeCopy[state.mode][0];
  renderSteps();
  renderOrbit();
  updateDock();
}

function animate(now) {
  const delta = Math.min(40, now - lastFrame);
  lastFrame = now;
  if (targetRotation !== null) {
    const distance = targetRotation - rotation;
    rotation += distance * .10;
    if (Math.abs(distance) < .002) targetRotation = null;
  } else if (!dragging) {
    rotation += delta * .000055;
  }
  positionOrbit();
  requestAnimationFrame(animate);
}

function requestText(item) {
  return `Здравствуйте. Хочу забронировать ${item.title}. Цена ${item.priceText} за штуку, комплект ${item.setText}. Артикул ${item.article}.`;
}

async function copyRequest() {
  const item = currentItem();
  if (!item) return;
  await navigator.clipboard.writeText(requestText(item));
  $("toast").classList.add("show");
  window.setTimeout(() => $("toast").classList.remove("show"), 1500);
}

async function shareRequest() {
  const item = currentItem();
  if (!item) return;
  if (navigator.share) {
    try {
      await navigator.share({ title: item.title, text: requestText(item) });
      return;
    } catch (error) {}
  }
  copyRequest();
}

document.querySelectorAll(".step").forEach((button) => {
  button.addEventListener("click", () => setMode(button.dataset.mode));
});

$("orbitalField").addEventListener("pointerdown", (event) => {
  dragging = true;
  dragStartX = event.clientX;
  dragStartRotation = rotation;
  targetRotation = null;
  $("orbitalField").setPointerCapture(event.pointerId);
});
$("orbitalField").addEventListener("pointermove", (event) => {
  if (!dragging) return;
  rotation = dragStartRotation + (event.clientX - dragStartX) * .007;
});
$("orbitalField").addEventListener("pointerup", () => { dragging = false; });
$("orbitalField").addEventListener("pointercancel", () => { dragging = false; });
$("orbitalField").addEventListener("wheel", (event) => {
  event.preventDefault();
  targetRotation = null;
  rotation += (event.deltaY + event.deltaX) * .0012;
}, { passive: false });
$("orbitalField").addEventListener("keydown", (event) => {
  if (event.key === "ArrowLeft") rotation -= .18;
  if (event.key === "ArrowRight") rotation += .18;
});

function applySearch() {
  state.search = $("aiSearch").value;
  state.selectedArticle = "";
  setMode("result");
}
$("searchBtn").addEventListener("click", applySearch);
$("aiSearch").addEventListener("keydown", (event) => {
  if (event.key === "Enter") applySearch();
});
$("aiSearch").addEventListener("input", (event) => {
  if (!event.target.value) {
    state.search = "";
    if (state.mode === "result") render();
  }
});
$("orderBtn").addEventListener("click", copyRequest);
$("shareBtn").addEventListener("click", shareRequest);
window.addEventListener("resize", positionOrbit);

render();
requestAnimationFrame(animate);
</script>
</body>
</html>
