<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>РАДО — выбор формата сайта</title>
<style>
:root{--bg:#050b16;--panel:rgba(255,255,255,.08);--line:rgba(160,205,255,.22);--blue:#2a8cff;--red:#ef352e;--txt:#f4f8ff;--muted:#9db3d0}
*{box-sizing:border-box}
body{margin:0;background:#050b16;color:var(--txt);font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
body:before{content:"";position:fixed;inset:0;background:url("public/rado-ai-hero.png") center/cover no-repeat;opacity:.72;z-index:-2}
body:after{content:"";position:fixed;inset:0;background:linear-gradient(90deg,#050b16 0%,rgba(5,11,22,.9) 38%,rgba(5,11,22,.45));z-index:-1}
.app{height:100vh;display:grid;grid-template-columns:360px 1fr}
.side{border-right:1px solid var(--line);background:rgba(5,11,22,.72);backdrop-filter:blur(20px);padding:22px;overflow:auto}
.logo{font-weight:900;font-size:26px}.logo small{display:block;color:#9dc9ff;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-top:4px}
h1{font-size:30px;line-height:1.05;margin:28px 0 10px}.lead{color:#b9cbe5;line-height:1.45;margin-bottom:18px}
.choice{width:100%;text-align:left;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.07);color:#fff;padding:14px;margin:8px 0;cursor:pointer}
.choice.active{background:linear-gradient(135deg,rgba(42,140,255,.38),rgba(239,53,46,.18));border-color:#70b8ff}
.choice b{display:block;font-size:16px}.choice span{display:block;color:#aac0dd;font-size:13px;margin-top:4px}
.stage{padding:28px;overflow:auto}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.pill{border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:999px;padding:9px 12px;color:#dcecff;font-weight:800}
.preview{min-height:calc(100vh - 96px);border:1px solid var(--line);border-radius:34px;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.045));backdrop-filter:blur(20px);box-shadow:0 28px 90px rgba(0,0,0,.42);overflow:hidden;position:relative}
.preview:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 20%,rgba(42,140,255,.22),transparent 36%);pointer-events:none}
.screen{position:relative;padding:34px;min-height:100%}
.screen h2{font-size:48px;line-height:.98;margin:0 0 14px;max-width:760px}.screen p{color:#bfd1e9;font-size:18px;line-height:1.5;max-width:720px}
.cta{border:0;border-radius:16px;background:linear-gradient(135deg,var(--red),#ff7544);color:#fff;font-weight:900;padding:14px 18px;margin:12px 8px 0 0}
.ghost{background:rgba(255,255,255,.1);border:1px solid var(--line)}
.glass{border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:24px;backdrop-filter:blur(18px)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
.product{padding:14px;min-height:300px}.photo{height:170px;border-radius:20px;background:radial-gradient(circle,rgba(42,140,255,.25),rgba(255,255,255,.06));display:grid;place-items:center;overflow:hidden}.photo img{max-width:86%;max-height:86%;filter:drop-shadow(0 22px 30px rgba(0,0,0,.45))}
.product b{display:block;margin-top:12px}.price{color:#ff7972;font-size:24px;font-weight:900;margin-top:8px}
.chat{max-width:720px;margin-top:30px}.msg{padding:16px 18px;margin:10px 0;border-radius:20px}.user{margin-left:80px;background:rgba(42,140,255,.22)}.bot{margin-right:80px;background:rgba(255,255,255,.09)}
.tunnel{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:34px}.step{padding:22px;min-height:190px}.step strong{font-size:42px;color:#70b8ff}
.drops{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}.drop{padding:24px;min-height:230px}.timer{font-size:42px;font-weight:900;color:#ff7972}
.phone{width:360px;max-width:100%;height:620px;margin:20px auto;border:1px solid var(--line);border-radius:38px;background:rgba(0,0,0,.28);padding:18px}.story{height:100%;border-radius:28px;background:linear-gradient(180deg,rgba(42,140,255,.22),rgba(239,53,46,.16));display:flex;flex-direction:column;justify-content:end;padding:22px}
.map{height:360px;margin-top:24px;position:relative;overflow:hidden}.route{position:absolute;left:10%;right:8%;top:58%;height:3px;background:linear-gradient(90deg,var(--blue),var(--red));transform:rotate(-10deg)}.dot{position:absolute;width:22px;height:22px;border-radius:50%;background:#70b8ff;box-shadow:0 0 30px #70b8ff}
.osgrid{display:grid;grid-template-columns:260px 1fr;gap:16px;margin-top:24px}.list{padding:16px}.line{height:44px;border-radius:12px;background:rgba(255,255,255,.08);margin:10px 0}
@media(max-width:900px){body{overflow:auto}.app{height:auto;grid-template-columns:1fr}.side{position:relative}.stage{padding:14px}.cards,.tunnel,.drops,.osgrid{grid-template-columns:1fr}.screen h2{font-size:36px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="logo">РАДО<small>choose site format</small></div>
  <h1>Выбираем не текст, а механику сайта</h1>
  <div class="lead">Нажимай варианты слева. Справа меняется живой прототип первого экрана: структура, UX и поведение.</div>
  <div id="choices"></div>
</aside>
<main class="stage">
  <div class="topbar"><div class="pill" id="modeLabel"></div><div class="pill">демо, не финал</div></div>
  <section class="preview"><div class="screen" id="screen"></div></section>
</main>
</div>
<script>
const products=[
 {title:"Pirelli Formula Energy 185/65 R15",price:"4 212 ₽",img:"https://cdn.jsdelivr.net/gh/test4433/avito-feed@main/rado_photos/4405300.png"},
 {title:"Tracmax X-Privilo TX5 195/65 R15",price:"3 393 ₽",img:"https://cdn.jsdelivr.net/gh/test4433/avito-feed@main/rado_photos/YSTX5R1516.png"},
 {title:"Hankook Kinergy Eco 2 185/60 R14",price:"3 899 ₽",img:"https://cdn.jsdelivr.net/gh/test4433/avito-feed@main/rado_photos/1024677.png"}
];
const modes=[
["AI-тоннель","3 шага вместо каталога: размер → сезон → бюджет"],
["3D showroom","В центре объект/шина, вокруг плавающие предложения"],
["Премиум-магазин","Полноценный магазин с фильтрами, избранным и заявкой"],
["AI-консьерж","Сайт начинается как чат-подборщик"],
["Дропы комплектов","Каждый день ограниченные горячие комплекты"],
["Сторис-каталог","Мобильный swipe-формат как stories"],
["Garage OS","B2B-панель для СТО, складов и перекупов"],
["Конфигуратор","Выбор авто/размера, затем совместимые комплекты"],
["Карта наличия","Склад, самовывоз, маршрут получения"],
["Hybrid","Две двери: подбор за 30 сек и полный каталог"]
];
const choices=document.getElementById("choices"),screen=document.getElementById("screen"),label=document.getElementById("modeLabel");
modes.forEach((m,i)=>choices.insertAdjacentHTML("beforeend",`<button class="choice" onclick="pick(${i})"><b>${String(i+1).padStart(2,"0")} · ${m[0]}</b><span>${m[1]}</span></button>`));
function productCards(){return `<div class="cards">${products.map(p=>`<article class="product glass"><div class="photo"><img src="${p.img}"></div><b>${p.title}</b><div class="price">${p.price}</div><button class="cta">Забрать комплект</button></article>`).join("")}</div>`}
function pick(i){
 document.querySelectorAll(".choice").forEach((b,n)=>b.classList.toggle("active",n===i)); label.textContent=modes[i][0];
 const heads=[
  `<h2>Подберем комплект за 30 секунд</h2><p>Клиент идет по тоннелю: размер, сезон, бюджет. На выходе только 3 лучших варианта, без перегруза.</p><button class="cta">Начать подбор</button><div class="tunnel"><div class="step glass"><strong>1</strong><p>Размер или авто</p></div><div class="step glass"><strong>2</strong><p>Сезон и стиль езды</p></div><div class="step glass"><strong>3</strong><p>Цена и комплект</p></div></div>`,
  `<h2>Шоурум вокруг шины</h2><p>Большая шина/объект в центре, карточки предложений всплывают как интерфейс вокруг нее.</p><button class="cta">Вращать подбор</button>${productCards()}`,
  `<h2>AI-commerce магазин</h2><p>Категории, фильтры, карточки, избранное и корзина-заявка. Похоже на дорогой магазин, а не лендинг.</p>${productCards()}`,
  `<h2>Напишите размер или авто</h2><p>Сайт работает как продавец-консультант. После ответа показывает варианты и объясняет разницу.</p><div class="chat"><div class="msg user glass">Нужны 195/65 R15 на лето</div><div class="msg bot glass">Нашел 3 комплекта: дешевле, оптимальный и бренд лучше.</div></div>${productCards()}`,
  `<h2>Сегодняшние горячие комплекты</h2><p>Формат дропов: ограниченный остаток, таймер, скидка на объем и быстрый заказ.</p><div class="drops"><div class="drop glass"><div class="timer">04:21:09</div><p>До обновления дропа</p><button class="cta">Забрать сейчас</button></div><div class="drop glass">${products[0].title}<div class="price">${products[0].price}</div><p>Осталось 41 шт</p></div></div>`,
  `<h2>Свайпай комплекты</h2><p>Мобильная витрина как stories: одна шина на экран, минимум текста, быстрое действие.</p><div class="phone"><div class="story"><div class="photo"><img src="${products[0].img}"></div><h3>${products[0].title}</h3><div class="price">${products[0].price}</div><button class="cta">Забронировать</button></div></div>`,
  `<h2>Garage OS для партнеров</h2><p>Интерфейс похож на профессиональную систему: партии, остатки, заявки, быстрый экспорт.</p><div class="osgrid"><div class="list glass"><b>Размеры</b><div class="line"></div><div class="line"></div><div class="line"></div></div><div class="list glass">${productCards()}</div></div>`,
  `<h2>Конфигуратор авто</h2><p>Выбери марку, модель, год или введи размер. Дальше сайт показывает совместимые комплекты.</p><button class="cta">Выбрать авто</button><button class="cta ghost">Ввести размер</button>${productCards()}`,
  `<h2>Наличие рядом и маршрут</h2><p>Сайт отвечает не только “что купить”, но и “как забрать”: склад, самовывоз, доставка.</p><div class="map glass"><i class="route"></i><i class="dot" style="left:12%;top:62%"></i><i class="dot" style="right:10%;top:42%"></i></div>`,
  `<h2>AI-магазин + тоннель</h2><p>Главный экран дает две двери: быстро подобрать за 30 секунд или открыть весь каталог.</p><button class="cta">Подобрать за 30 секунд</button><button class="cta ghost">Открыть каталог</button>${productCards()}`
 ];
 screen.innerHTML=heads[i];
}
pick(9);
</script>
</body>
</html>
