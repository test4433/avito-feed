<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>РАДО ШИНЫ — витрина</title>
<style>
:root {
  --blue:#0e5fb0; --blue2:#084a8d; --red:#e5322b; --ink:#18212d;
  --muted:#667085; --line:#d8e0ea; --soft:#f3f6fa; --white:#fff;
}
* { box-sizing:border-box; }
body { margin:0; font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:var(--soft); }
button,input,select { font:inherit; }
.top { position:sticky; top:0; z-index:20; background:var(--blue); color:#fff; border-bottom:1px solid rgba(255,255,255,.18); }
.top-inner { max-width:1240px; margin:0 auto; min-height:72px; display:flex; align-items:center; gap:22px; padding:12px 18px; }
.brand { display:flex; align-items:baseline; gap:10px; min-width:210px; }
.brand strong { font-size:28px; letter-spacing:.02em; }
.brand span { color:#d6e9ff; font-size:13px; }
.search { flex:1; min-width:180px; }
.search input { width:100%; border:0; border-radius:8px; padding:13px 14px; outline:0; }
.count { font-weight:700; white-space:nowrap; }
.hero { background:#fff; border-bottom:1px solid var(--line); }
.hero-inner { max-width:1240px; margin:0 auto; padding:26px 18px 20px; display:grid; grid-template-columns:1.2fr .8fr; gap:22px; align-items:end; }
h1 { margin:0; font-size:42px; line-height:1.05; letter-spacing:0; }
.hero p { margin:12px 0 0; color:var(--muted); font-size:17px; max-width:720px; }
.deal { background:var(--red); color:#fff; border-radius:8px; padding:18px; font-weight:700; }
.filters { max-width:1240px; margin:0 auto; padding:16px 18px 8px; }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
.chip { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:8px; padding:9px 12px; cursor:pointer; }
.chip.active { background:var(--blue); border-color:var(--blue); color:#fff; }
.select { border:1px solid var(--line); background:#fff; border-radius:8px; padding:10px 12px; }
.grid { max-width:1240px; margin:0 auto; padding:14px 18px 42px; display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.card { background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden; display:flex; flex-direction:column; min-width:0; }
.photo { aspect-ratio:1/1.08; background:#fff; display:flex; align-items:center; justify-content:center; border-bottom:1px solid var(--line); }
.photo img { width:100%; height:100%; object-fit:contain; display:block; }
.info { padding:13px; display:flex; flex-direction:column; gap:9px; flex:1; }
.title { font-weight:800; line-height:1.2; min-height:42px; overflow:hidden; }
.meta { display:flex; gap:7px; flex-wrap:wrap; }
.tag { background:#edf4fc; color:var(--blue2); border-radius:6px; padding:5px 7px; font-size:12px; font-weight:700; }
.tag.red { background:#fff0ef; color:var(--red); }
.price { display:flex; align-items:baseline; gap:8px; margin-top:2px; }
.price strong { font-size:24px; color:var(--red); }
.price span { color:var(--muted); }
.set { font-weight:800; }
.rest { color:var(--muted); font-size:14px; }
.actions { display:grid; grid-template-columns:1fr; gap:8px; margin-top:auto; }
.btn { border:0; border-radius:8px; padding:11px 12px; background:var(--blue); color:#fff; font-weight:800; cursor:pointer; }
.btn:hover { background:var(--blue2); }
.empty { max-width:1240px; margin:0 auto; padding:40px 18px; color:var(--muted); display:none; }
.toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 16px; border-radius:8px; opacity:0; pointer-events:none; transition:.2s; z-index:50; }
.toast.show { opacity:1; }
@media (max-width:1050px) { .grid { grid-template-columns:repeat(3,1fr); } }
@media (max-width:760px) {
  .top-inner { align-items:stretch; flex-direction:column; gap:10px; }
  .brand { min-width:0; }
  .hero-inner { grid-template-columns:1fr; }
  h1 { font-size:31px; }
  .grid { grid-template-columns:repeat(2,1fr); gap:10px; padding-left:10px; padding-right:10px; }
  .filters { padding-left:10px; padding-right:10px; }
  .title { font-size:14px; min-height:50px; }
  .price strong { font-size:20px; }
}
@media (max-width:430px) {
  .grid { grid-template-columns:1fr; }
  .photo { aspect-ratio:1.15/1; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand"><strong>РАДО</strong><span>витрина шин</span></div>
    <div class="search"><input id="q" placeholder="Поиск: размер, бренд, модель, например 205/55 R16"></div>
    <div class="count" id="count"></div>
  </div>
</header>
<section class="hero">
  <div class="hero-inner">
    <div>
      <h1>Новые шины в наличии</h1>
      <p>Оригинальные РАДО-карточки, цены как на Авито, комплекты по 4 шт. Напишите размер или авто — подберем варианты.</p>
    </div>
    <div class="deal">Для СТО, шиномонтажей и перекупов — отдельная цена на объем.</div>
  </div>
</section>
<section class="filters">
  <div class="row" id="season">
    <button class="chip active" data-season="">Все</button>
    <button class="chip" data-season="летняя">Лето</button>
    <button class="chip" data-season="зимняя">Зима</button>
    <button class="chip" data-season="всесезонная">Всесезон</button>
  </div>
  <div class="row">
    <select class="select" id="size"><option value="">Все размеры</option></select>
    <select class="select" id="brand"><option value="">Все бренды</option></select>
    <select class="select" id="sort">
      <option value="popular">Сначала ходовые</option>
      <option value="cheap">Сначала дешевле</option>
      <option value="priceDesc">Сначала дороже</option>
      <option value="rest">Сначала большой остаток</option>
    </select>
  </div>
</section>
<main class="grid" id="grid"></main>
<div class="empty" id="empty">Ничего не найдено. Попробуйте другой размер или бренд.</div>
<div class="toast" id="toast">Заявка скопирована</div>

nental", "model": "VikingContact 8", "size": "225/45 R19", "season": "зимняя", "price": 24670, "priceText": "24 670 ₽", "setText": "98 680 ₽", "rest": 4, "image": "https://cdn.jsdelivr.net/gh/test4433/avito-feed@main/rado_photos/0345829.png", "title": "Continental VikingContact 8 225/45 R19"}, {"article": "3220018488", "brand": "Sailun", "model": "Erange Premium S01", "size": "275/45 R21", "season": "летняя", "price": 16169, "priceText": "16 169 ₽", "setText": "64 676 ₽", "rest": 4, "image": "https://cdn.jsdelivr.net/gh/test4433/avito-feed@main/rado_photos/3220018488.png", "title": "Sailun Erange Premium S01 275/45 R21"}, {"article": "0315578", "brand": "Continental", "model": "EcoContact 6", "size": "235/50 R19", "season": "летняя", "price": 21026, "priceText": "21 026 ₽", "setText": "84 104 ₽", "rest": 4, "image": "https://cdn.jsdelivr.net/gh/test4433/avito-feed@main/rado_photos/0315578.png", "title": "Continental EcoContact 6 235/50 R19"}];
const SIZES = ["195/65 R15", "205/60 R16", "215/55 R17", "205/55 R16", "185/60 R15", "235/55 R17", "235/60 R18", "175/65 R14", "205/50 R17", "235/65 R17", "185/65 R15", "215/65 R16", "225/55 R18", "235/65 R18", "235/55 R18", "225/55 R17", "225/50 R17", "235/45 R18", "225/65 R17", "205/65 R16", "225/45 R18", "215/50 R17", "235/55 R19", "215/60 R16"];
const BRANDS = ["Gislaved", "Ikon", "Pirelli", "Yokohama", "Pirelli Formula", "Hankook", "Viatti", "Cordiant", "Roadcruza", "Tracmax", "Michelin", "LingLong Leao", "Goodride", "Fortune", "Attar", "Sailun", "HiFly", "Landspider"];
const state = { q:"", season:"", size:"", brand:"", sort:"popular" };
const grid = document.getElementById("grid");
const count = document.getElementById("count");
const empty = document.getElementById("empty");
const toast = document.getElementById("toast");

for (const s of SIZES) document.getElementById("size").insertAdjacentHTML("beforeend", `<option>${s}</option>`);
for (const b of BRANDS) document.getElementById("brand").insertAdjacentHTML("beforeend", `<option>${b}</option>`);

function norm(v) { return String(v || "").toLowerCase().replace("r"," r").replace(/\s+/g," ").trim(); }
function scorePopular(x) {
  const popular = SIZES.slice(0, 16).includes(x.size) ? 1 : 0;
  return popular * 100000 + Math.min(x.rest, 41) * 100 - x.price / 10;
}
function filtered() {
  let rows = ITEMS.filter(x => {
    const hay = norm([x.title, x.brand, x.model, x.size, x.season, x.article].join(" "));
    return (!state.q || hay.includes(norm(state.q)))
      && (!state.season || x.season === state.season)
      && (!state.size || x.size === state.size)
      && (!state.brand || x.brand === state.brand);
  });
  rows.sort((a,b) => {
    if (state.sort === "cheap") return a.price - b.price;
    if (state.sort === "priceDesc") return b.price - a.price;
    if (state.sort === "rest") return b.rest - a.rest;
    return scorePopular(b) - scorePopular(a);
  });
  return rows;
}
function esc(s) { return String(s || "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function requestText(x) {
  return `Здравствуйте. Интересуют шины ${x.title}. Цена ${x.priceText}/шт, комплект ${x.setText}. Артикул ${x.article}.`;
}
async function copyReq(i) {
  const x = filtered()[i];
  await navigator.clipboard.writeText(requestText(x));
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 1400);
}
function render() {
  const rows = filtered();
  count.textContent = `${rows.length} товаров`;
  empty.style.display = rows.length ? "none" : "block";
  grid.innerHTML = rows.slice(0, 160).map((x,i) => `
    <article class="card">
      <div class="photo"><img loading="lazy" src="${esc(x.image)}" alt="${esc(x.title)}"></div>
      <div class="info">
        <div class="title">${esc(x.title)}</div>
        <div class="meta"><span class="tag">${esc(x.size)}</span><span class="tag red">${esc(x.season || "сезон")}</span></div>
        <div class="price"><strong>${esc(x.priceText)}</strong><span>за 1 шт</span></div>
        <div class="set">Комплект 4 шт: ${esc(x.setText)}</div>
        <div class="rest">В наличии: ${x.rest} шт · Арт. ${esc(x.article)}</div>
        <div class="actions"><button class="btn" onclick="copyReq(${i})">Скопировать заявку</button></div>
      </div>
    </article>
  `).join("");
}
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
document.getElementById("size").addEventListener("change", e => { state.size = e.target.value; render(); });
document.getElementById("brand").addEventListener("change", e => { state.brand = e.target.value; render(); });
document.getElementById("sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
document.getElementById("season").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  document.querySelectorAll("#season .chip").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  state.season = b.dataset.season;
  render();
});
render();
</script>
